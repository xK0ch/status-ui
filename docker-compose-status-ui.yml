services:
  status-ui:
    build: .
    container_name: status-ui
    networks:
      - proxy-net
      - status-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.status.rule=Host(`status.fynn-koch.de`)
      - traefik.http.routers.status.entrypoints=websecure
      - traefik.http.routers.status.tls.certresolver=letsencrypt
      - traefik.http.services.status.loadbalancer.server.port=80
    restart: unless-stopped

networks:
  proxy-net:
    name: proxy-net
    external: true
  status-net:
    name: status-net
    external: true
